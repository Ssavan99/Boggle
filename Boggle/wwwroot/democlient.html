<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Play Boggle online - find words on a 4x4 board against friends in real time, or solo against the computer." />
    <link rel="canonical" href="https://boggle-fxe8hwa0duhvc8hc.centralus-01.azurewebsites.net/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Boggle - online word game" />
    <meta property="og:description" content="Find words on a 4x4 board against friends in real time, or solo against the computer." />
    <meta property="og:url" content="https://boggle-fxe8hwa0duhvc8hc.centralus-01.azurewebsites.net/" />
    <meta property="og:image" content="https://boggle-fxe8hwa0duhvc8hc.centralus-01.azurewebsites.net/images/boggle-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="google-site-verification" content="u6vu8f2chTQdjz_vTWQVa-8DiqXTpoF5ilKtepFvVss" />
    <title>Boggle - online word game</title>
    <script src="js/jquery/jquery.min.js" type="text/javascript"></script>
    <script src="js/apis.js" type="text/javascript"></script>
    <script src="js/utils.js" type="text/javascript"></script>
    <script src="js/boggle.js" type="text/javascript"></script>
    <link rel="stylesheet" href="css/boggle.css">

</head>
<body>
    <img src="/images/boggle-logo.png" id="logo" />
    <div class="sc" id="sc_start">
        <h1 style="font-family: Helvetica">ENTER YOUR NAME</h1>
        <input id="txt_gameid" placeholder="Game ID" value="" /><br />
        <input id="txt_username" placeholder="Username" value="" /><br />
        <br />
        <button style="color: #faa964; background-color: #ffffff" id="btn_joingame">Join Game</button>
        <button style="color: #ffffff; background-color: #faa964" id="btn_newgame">New Game</button>

        <div class="solo">
            <label for="sel_difficulty">Or play alone against the computer</label>
            <div class="solo-row">
                <select id="sel_difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                </select>
                <button id="btn_vscomputer">Play vs Computer</button>
            </div>
        </div>
        <div class="rules-btn" id="btn_rules">
            <button class="btn-rules" onclick=" window.open('https://www.hasbro.com/common/instruct/boggle.pdf','_blank')"> Rules</button>
        </div>
    </div>

    <div class="sc" id="sc_lobby">
        <h1 style="font-family: Helvetica">LOBBY | GAME ID: <span class="cls_gameid" id="lbl_gameid_1"></span></h1>
        <h2 style="font-family: Helvetica">Members: <span id="lbl_members"></span></h2>
        <button style="color: #faa964; background-color: #ffffff" id="btn_leavelobby">Leave Lobby</button>
        <button style="color: #ffffff; background-color: #faa964" id="btn_startgame">Start Game</button>
    </div>

    <div class="sc" id="sc_game">
        <div id="gamelog">
            <table id="tbl_gamelog" border="1">
                <tbody>
                </tbody>
            </table>
        </div>
        <p>
            Game <span class="cls_gameid" id="lbl_gameid_2"></span>
            &middot; <span id="lbl_username"></span>
            &middot; <span id="lbl_time"></span>
        </p>
        <table id="tbl_game" style="margin-left:auto;margin-right:auto;">
            <tr>
                <td><button id="cell_00">?</button></td>
                <td><button id="cell_01">?</button></td>
                <td><button id="cell_02">?</button></td>
                <td><button id="cell_03">?</button></td>
            </tr>
            <tr>
                <td><button id="cell_10">?</button></td>
                <td><button id="cell_11">?</button></td>
                <td><button id="cell_12">?</button></td>
                <td><button id="cell_13">?</button></td>
            </tr>
            <tr>
                <td><button id="cell_20">?</button></td>
                <td><button id="cell_21">?</button></td>
                <td><button id="cell_22">?</button></td>
                <td><button id="cell_23">?</button></td>
            </tr>
            <tr>
                <td><button id="cell_30">?</button></td>
                <td><button id="cell_31">?</button></td>
                <td><button id="cell_32">?</button></td>
                <td><button id="cell_33">?</button></td>
            </tr>
        </table>

        <div id="current_word" aria-live="polite"></div>

        <button id="btn_guess">Guess</button>
        <button id="btn_resetguess">Reset</button>
        <button id="btn_endgame">End Game</button>
        <button id="btn_playagain" disabled>Play Again</button>

        <br /><br /><br />
        <table class="in_line" id="tbl_scoreboard" border="1">
            <thead>
                <tr>
                    <td>Guess</td>
                    <td>Score</td>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        <table class="in_line" id="tbl_players" border="1">
            <thead>
                <tr>
                    <td>Current Players</td>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</body>
</html>
